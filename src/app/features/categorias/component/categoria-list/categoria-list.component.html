<p-table
            #dt
            [value]="categorias()"
            [rows]="10"
            [columns]="cols"
            [paginator]="true"
            [globalFilterFields]="['nombre', 'activo', 'usuarioCreacion', 'fechaCreacion']"
            [tableStyle]="{ 'min-width': '75rem' }"
            [(selection)]="selectedProducts"
            [rowHover]="true"
            dataKey="idCategoria"
            currentPageReportTemplate="Mostrando {first} de {last} a {totalRecords} categorias"
            [showCurrentPageReport]="true"
            [rowsPerPageOptions]="[10, 20, 30]"
        >
            <ng-template #caption>
                <div class="flex items-center justify-between">
                    <h5 class="m-0">Listado de Categoria</h5>
                    <p-iconfield>
                        <p-inputicon styleClass="pi pi-search" />
                        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Buscar..." />
                    </p-iconfield>
                </div>
            </ng-template>
            <ng-template #header>
                <tr>
                    <th style="width: 3rem">
                        <p-tableHeaderCheckbox />
                    </th>
                    <th style="min-width: 8rem">Id</th>
                    <th pSortableColumn="nombre" style="min-width:12rem">
                        Nombre
                        <p-sortIcon field="nombre" />
                    </th>
                    <th pSortableColumn="activo" style="min-width: 12rem">
                        Estado
                        <p-sortIcon field="activo" />
                    </th>
                    <th pSortableColumn="usuarioCreacion" style="min-width: 8rem">
                        Usuario Creación
                        <p-sortIcon field="usuarioCreacion" />
                    </th>
                    <th pSortableColumn="fechaCreacion" style="min-width: 8rem">
                        Fecha Creación
                        <p-sortIcon field="fechaCreacion" />
                    </th>
                    <th style="min-width: 12rem"></th>
                </tr>
            </ng-template>
            <ng-template #body let-categoria>
                <tr>
                    <td><p-tableCheckbox [value]="categoria" /></td>
                    <td>{{ categoria.idCategoria }}</td>
                    <td>{{ categoria.nombre }}</td>
                    <td>
                        <p-tag [value]="categoria.activo ? 'ACTIVO' : 'INACTIVO'"
                            [severity]="categoria.activo ? 'success' : 'danger'" />
                    </td>
                    <td>{{ categoria.usuarioCreacion }}</td>
                    <td>{{ categoria.fechaCreacion | date:'dd/MM/yyyy' }}</td>
                    <td>
                        <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="editCategoria(categoria)" />
                        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteCategoria(categoria)" />
                    </td>
                </tr>
            </ng-template>

            <ng-template #emptymessage>
                <tr>
                    <td colspan="7">No se encontraron categorías.</td>
                </tr>
            </ng-template>

</p-table>

<p-confirmDialog />
