<p-table
            #dt
            [value]="productos()"
            [rows]="10"
            [columns]="cols"
            [paginator]="true"
            [globalFilterFields]="['nombre', 'activo', 'usuarioCreacion', 'fechaCreacion']"
            [tableStyle]="{ 'min-width': '75rem' }"
            [(selection)]="selectedProducto"
            [rowHover]="true"
            dataKey="idProducto"
            currentPageReportTemplate="Mostrando {first} de {last} a {totalRecords} Productos"
            [showCurrentPageReport]="true"
            [rowsPerPageOptions]="[10, 20, 30]"
        >
            <ng-template #caption>
                <div class="flex items-center justify-between">
                    <h5 class="m-0">Listado de Producto</h5>
                    <p-iconfield>
                        <p-inputicon styleClass="pi pi-search" />
                        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Buscar..." />
                    </p-iconfield>
                </div>
            </ng-template>
            <ng-template #header>
                <tr>
                    <th style="width: 3rem">
                        <p-tableHeaderCheckbox />
                    </th>
                    <th style="min-width: 5rem">Id</th>
                    <th style="min-width: 8rem">Imagen</th>
                    <th pSortableColumn="categoria" style="min-width:10rem">
                        Categoria
                        <p-sortIcon field="categoria" />
                    </th>
                    <th pSortableColumn="marca" style="min-width: 10rem">
                        Marca
                        <p-sortIcon field="marca" />
                    </th>
                    <th pSortableColumn="nombre" style="min-width: 14rem">
                        Nombre Producto
                        <p-sortIcon field="nombre" />
                    </th>
                    <th pSortableColumn="descripcion" style="min-width: 14rem">
                        Descripcion Producto
                        <p-sortIcon field="descripcion" />
                    </th>
                    <th pSortableColumn="activo" style="min-width: 8rem">
                        Estado
                        <p-sortIcon field="activo" />
                    </th>
                    <th pSortableColumn="precio" style="min-width: 4rem">
                        Precio
                        <p-sortIcon field="precio" />
                    </th>
                    <th pSortableColumn="stock" style="min-width: 4rem">
                        Stock
                        <p-sortIcon field="stock" />
                    </th>
                    <th style="min-width: 12rem"></th>
                </tr>
            </ng-template>
            <ng-template #body let-producto>
                <tr>
                    <td><p-tableCheckbox [value]="producto" /></td>
                    <td>{{ producto.idProducto }}</td>
                    <td>
                         <p-image *ngIf="producto.imagenUrl; else sinImagen"
                                [src]="producto.imagenUrl" [preview]="true" width="56"
                                pTooltip="Click para ampliar" tooltipPosition="top" />
                        <ng-template #sinImagen>
                            <img src="assets/no-image.png" class="w-14 h-14 object-cover rounded-md" />
                        </ng-template>
                    </td>
                    <td>{{ producto.categoria }}</td>
                    <td>{{ producto.marca }}</td>
                    <td>{{ producto.nombre }}</td>
                    <td>{{ producto.descripcion }}</td>
                    <td>
                        <p-tag [value]="producto.activo ? 'ACTIVO' : 'INACTIVO'"
                            [severity]="producto.activo ? 'success' : 'danger'" />
                    </td>
                    <td>{{ producto.precio }}</td>
                    <td>{{ producto.stock }}</td>
                    <td>
                        <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="editProducto(producto)" />
                        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteProducto(producto)" />
                    </td>
                </tr>
            </ng-template>

            <ng-template #emptymessage>
                <tr>
                    <td colspan="7">No se encontraron productos.</td>
                </tr>
            </ng-template>

</p-table>

<p-confirmDialog />
